[workspace]
resolver = "2"
members = [
    "crates/mtab-core",
    "crates/mtab-audio",
    "crates/mtab-guitar",
    "crates/mtab-export",
    "crates/mtab-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/romankolov/mtab"
authors = ["romankolov"]
rust-version = "1.75"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
