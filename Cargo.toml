[workspace]
exclude = ["vendor/guitarpro"]
resolver = "2"
members = [
    "crates/mtab-core",
    "crates/mtab-audio",
    "crates/mtab-guitar",
    "crates/mtab-export",
    "crates/mtab-cli",
    "crates/mtab",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/romankolov/mtab"
authors = ["romankolov"]
rust-version = "1.75"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
symphonia-format-riff = { path = "vendor/symphonia-format-riff" }
symphonia-codec-aac = { path = "vendor/symphonia-codec-aac" }
symphonia-metadata = { path = "vendor/symphonia-metadata" }
symphonia-utils-xiph = { path = "vendor/symphonia-utils-xiph" }
