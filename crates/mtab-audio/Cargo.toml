[package]
name = "mtab-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Audio ingest and feature extraction for muscriptor-tab (decode, resample, mel frontend)"

[lib]
name = "mtab_audio"

[dependencies]
mtab-core = { path = "../mtab-core" }
rubato = "0.16"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp1",
    "mp2",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
    "caf",
    "aiff",
] }
