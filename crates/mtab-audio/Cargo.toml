[package]
name = "mtab-audio"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true
description = "Audio ingest and feature extraction for muscriptor-tab (decode, resample, mel frontend)"

[lib]
name = "mtab_audio"

[dependencies]
mtab-core = { path = "../mtab-core" }
rubato = "0.16"
rustfft = "6"
symphonia = { version = "0.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp1",
    "mp2",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
    "caf",
    "aiff",
] }

[dependencies.ort]
version = "=2.0.0-rc.14"
default-features = false
features = ["std", "api-22", "load-dynamic"]
optional = true

[features]
default = []
# Guitar stem separation (PROMPT.md §7.1). Loads ONNX Runtime at runtime, so the
# core stays a plain Rust binary and nothing is linked in unless asked for.
separation = ["dep:ort"]
