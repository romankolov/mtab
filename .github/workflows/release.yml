# Release — cross-platform release builds, packaging, checksums, GitHub Release.
# Triggered by version tags (v*) or manual dispatch (dry-run: builds only).
# Part of the mtab scaffold (PROMPT.md §12).
#
# IMPORTANT (PROMPT.md §10/§11): release artifacts must NEVER contain model
# weights (*.safetensors) — MuScriptor weights are CC BY-NC 4.0 and gated.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          # Linux arm64 runners are free for PUBLIC repos only.
          # Remove this leg if the repo is made private without arm runners.
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: cargo build --release
        run: cargo build --release --locked --target ${{ matrix.target }} -p mtab-cli

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          set -euo pipefail
          STAGE="mtab-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$STAGE"
          cp "target/${{ matrix.target }}/release/mtab" "dist/$STAGE/"
          cp README.md LICENSE NOTICE PROMPT.md "dist/$STAGE/" 2>/dev/null || cp README.md LICENSE NOTICE "dist/$STAGE/"
          tar -C dist -czf "dist/$STAGE.tar.gz" "$STAGE"
          rm -rf "dist/$STAGE"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "mtab-$env:GITHUB_REF_NAME-${{ matrix.target }}"
          New-Item -ItemType Directory -Force -Path "dist/$stage"
          Copy-Item "target/${{ matrix.target }}/release/mtab.exe" "dist/$stage/"
          Copy-Item README.md, LICENSE, NOTICE, PROMPT.md "dist/$stage/"
          Compress-Archive -Path "dist/$stage" -DestinationPath "dist/$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mtab-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: build
    # Only real tags publish; manual dispatch is a dry-run of the builds.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: SHA256SUMS
        run: |
          set -euo pipefail
          cd dist
          sha256sum mtab-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*
          fail_on_unmatched_files: true
