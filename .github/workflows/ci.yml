# CI — lint + tests + smoke build on every push to main and every PR.
# Part of the mtab scaffold (PROMPT.md §12). Keep matrices in sync with the
# workspace as crates/features are added.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  lint:
    name: Lint (rustfmt + clippy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt --check
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo test
        run: cargo test --workspace --locked
      - name: release smoke build
        run: cargo build --workspace --release --locked

  independent-midi-checker:
    name: Independent MIDI checker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: midi-independent
      - run: python -m pip install mido==1.3.3
      - run: python tools/test_check_midi_mido.py
      - run: cargo run --locked -p mtab-export --example midi_bend_fixture -- "$RUNNER_TEMP/bend.mid"
      - run: python tools/check_midi_bend_mido.py "$RUNNER_TEMP/bend.mid"

  independent-guitarset-frame-metrics:
    name: Independent framewise GuitarSet metric checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: guitarset-frame-metrics
      - run: cargo build --locked -p mtab-cli
      - run: python tools/test_guitarset_frame_score.py target/debug/mtab

  independent-gp5-roundtrip:
    name: Independent GP5 round-trip
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: gp5-roundtrip
      - run: python -m pip install PyGuitarPro==0.10.1
      - name: Verify GP5 using independent parser
        env:
          MTAB_PYGUITARPRO_PYTHON: python
          MTAB_GP5_FIXTURE_DIR: ${{ runner.temp }}/mtab-gp5-fixtures
        run: |
          cargo test --locked -p mtab-export --test gp5_roundtrip -- --ignored --nocapture
          cargo test --locked -p mtab-cli --bin mtab mixed_midi_gp5_outputs_and_format_conflicts -- --nocapture
          cargo test --locked -p mtab-cli --bin mtab synthetic_silent_transcription_writes_all_four_formats -- --nocapture
          cargo test --locked -p mtab-cli --bin mtab gp5_ir_reconstruction_handles_ties_and_quantized_notes -- --nocapture
          python tools/check_gp5_tuxguitar_roundtrip.py "$MTAB_GP5_FIXTURE_DIR/bends.gp5" crates/mtab-export/tests/fixtures/tuxguitar-1.6.6/bends.gp5
          python tools/check_gp5_tuxguitar_roundtrip.py "$MTAB_GP5_FIXTURE_DIR/techniques.gp5" crates/mtab-export/tests/fixtures/tuxguitar-1.6.6/techniques.gp5

  independent-musicxml:
    name: Independent MusicXML 3.1 validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: musicxml-validation
      - run: python -m pip install lxml==5.3.2 music21==9.7.1
      - name: Validate schema and independently interpret notes
        env:
          MTAB_XML_PYTHON: python
          MTAB_XML_FIXTURE_DIR: ${{ runner.temp }}/mtab-musicxml
        run: |
          cargo test --locked -p mtab-export --test musicxml -- --ignored --nocapture
          cargo test --locked -p mtab-cli --bin mtab synthetic_silent_transcription_writes_all_four_formats -- --nocapture
          cargo test --locked -p mtab-cli --bin mtab mixed_midi_gp5_outputs_and_format_conflicts -- --nocapture
          python tools/check_musicxml_music21.py "$MTAB_XML_FIXTURE_DIR/fixture.musicxml"
          python tools/check_musicxml_schema.py crates/mtab-export/tests/fixtures/musescore-3.2.3/fixture.musicxml
          python tools/check_musicxml_music21.py crates/mtab-export/tests/fixtures/musescore-3.2.3/fixture.musicxml

  msrv:
    name: Minimum Rust 1.75
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.75.0
      - uses: Swatinem/rust-cache@v2
        with:
          key: msrv-1.75
      - name: cargo test on MSRV
        run: cargo test --workspace --locked

  doc:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: cargo doc
        run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: "-D warnings"
