# Nightly / extended runs — weekly + on demand.
# Part of the mtab scaffold (PROMPT.md §12):
#   1. extended tests in release mode
#   2. cargo audit (RustSec advisory DB)
#   3. optional GuitarSet eval (needs run_eval=true AND the HF_TOKEN repo
#      secret, since MuScriptor weights are gated behind CC BY-NC 4.0)

name: Nightly

on:
  schedule:
    - cron: "17 4 * * 1" # Mondays 04:17 UTC (off the top of the hour)
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run end-to-end evaluation of the 5s GuitarSet development excerpt (requires HF_TOKEN)"
        type: boolean
        default: false
      run_oracle:
        description: "Run oracle-note fingering eval on GuitarSet annotations"
        type: boolean
        default: false
      run_real_small:
        description: "Test real guitar with official small weights (requires HF_TOKEN)"
        type: boolean
        default: false
      run_end_to_end:
        description: "Score a held-out GuitarSet audio subset end to end (requires HF_TOKEN)"
        type: boolean
        default: false
      eval_entries:
        description: "End-to-end excerpts to score (0 = all 180)"
        type: string
        default: "40"

env:
  CARGO_TERM_COLOR: always

jobs:
  extended-tests:
    name: Extended tests (release mode)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly
      - name: cargo test --release
        run: cargo test --workspace --release --locked
      - name: cargo build --release (all default-feature targets)
        run: cargo build --workspace --release --locked

  audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  eval:
    name: GuitarSet eval (optional)
    runs-on: ubuntu-latest
    # The job is only meaningful when weights can be fetched (gated, CC BY-NC).
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-eval
      - name: Download and verify gated small checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::Set the HF_TOKEN repository secret for an account with accepted model conditions.'
            exit 1
          fi
          curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" \
            -o "$RUNNER_TEMP/mtab-small.safetensors" \
            'https://huggingface.co/MuScriptor/muscriptor-small/resolve/main/model.safetensors'
          echo "bbd482c786b895cf7d8f44185073d951adae2ebb8a66f82ca84cd1f84569549c  $RUNNER_TEMP/mtab-small.safetensors" | sha256sum -c -
      - name: Transcribe and evaluate one 5-second development excerpt
        env:
          MATMUL_NUM_THREADS: '2'
        run: |
          cargo run --release --locked -p mtab-cli -- eval \
            --audio-manifest crates/mtab-cli/tests/fixtures/guitarset/guitarset_audio_manifest.json \
            --weights "$RUNNER_TEMP/mtab-small.safetensors" --size small \
            --max-gen-len 512 --report eval.md
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval.md
          if-no-files-found: warn

  oracle-eval:
    name: GuitarSet oracle-note fingering (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_oracle
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-oracle
      - name: Download public GuitarSet 1.1.0 annotations (CC BY 4.0)
        run: |
          curl -fL --retry 3 -o annotations.zip 'https://zenodo.org/records/3371780/files/annotation.zip?download=1'
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  annotations.zip' | md5sum -c -
          mkdir annotations
          unzip -q -j annotations.zip '*.jams' -d annotations
      - name: Run oracle-note string assignment evaluation
        run: |
          cargo run --release --locked -p mtab-cli -- eval --corpus guitarset \
            --oracle-notes --annotations annotations --report eval-oracle.md
      - name: Show the headline numbers
        run: sed -n '/^| Method/,/^$/p;/^## Feasibility/,$p' eval-oracle.md | head -40
      - name: Upload oracle-note report
        uses: actions/upload-artifact@v4
        with:
          name: guitarset-oracle-report
          path: eval-oracle.md
          if-no-files-found: error

  end-to-end-eval:
    name: GuitarSet end-to-end audio evaluation (optional)
    runs-on: ubuntu-latest
    timeout-minutes: 340
    if: github.event_name == 'workflow_dispatch' && inputs.run_end_to_end
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-end-to-end
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build the CLI
        run: cargo build --release --locked -p mtab-cli
      - name: Fetch the gated small checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::Set the HF_TOKEN repository secret for an account that accepted the model conditions.'
            exit 1
          fi
          ./target/release/mtab download --size small --out "$RUNNER_TEMP/mtab-small.safetensors"
      - name: Fetch GuitarSet annotations and audio (CC BY 4.0)
        run: |
          curl -fL --retry 3 -o annotations.zip 'https://zenodo.org/records/3371780/files/annotation.zip?download=1'
          echo 'b39b78e63d3446f2e54ddb7a54df9b10  annotations.zip' | md5sum -c -
          mkdir annotations && unzip -q -j annotations.zip '*.jams' -d annotations
          curl -fL --retry 3 -o audio.zip 'https://zenodo.org/records/3371780/files/audio_mono-mic.zip?download=1'
          mkdir audio && unzip -q -j audio.zip '*.wav' -d audio
      - name: Build the held-out excerpt manifest
        run: |
          python3 tools/make_guitarset_excerpt_manifest.py \
            --audio audio --annotations annotations \
            --out eval/heldout.json --clips eval/clips \
            --seconds 10 --sessions 03,04,05
      - name: Transcribe and score
        # A non-zero exit means some recordings failed (strict EOS, unplayable
        # fingering, short audio). Keep going so the report still uploads: the
        # per-entry status column is what says which, and why.
        continue-on-error: true
        env:
          MTAB_EXCERPTS: ${{ inputs.eval_entries }}
        run: |
          python3 - "$MTAB_EXCERPTS" <<'PY'
          import json, sys
          manifest = json.load(open("eval/heldout.json"))
          limit = int(sys.argv[1])
          if limit > 0:
              manifest = manifest[:limit]
          json.dump(manifest, open("eval/run.json", "w"), indent=1)
          print(f"{len(manifest)} excerpts")
          PY
          ./target/release/mtab eval --corpus guitarset \
            --audio-manifest eval/run.json \
            --weights "$RUNNER_TEMP/mtab-small.safetensors" \
            --size small --max-gen-len 2000 --partial-fingering \
            --emit-ir-dir eval/ir --report eval/report.md
      - name: Show the headline metrics
        if: always()
        run: |
          sed -n '/| Micro-aggregated/,/^$/p' eval/report.md || true
          echo '--- entries that did not score ---'
          grep -E '\| (failed|error) ' eval/report.md || echo 'none' 
      - name: Upload the report and the emitted IR (no model weights)
        # eval/ir is what tools/autotab_head_to_head.py needs to put a rival
        # fingerer on exactly these notes; it holds tablature JSON only.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guitarset-end-to-end-report
          path: |
            eval/report.md
            eval/run.json
            eval/ir
          if-no-files-found: error

  real-small-guitar:
    name: Official small real-guitar smoke (optional)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_real_small
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: nightly-real-small
      - name: Download and verify gated small checkpoint
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ -z "$HF_TOKEN" ]; then
            echo '::error::Set the HF_TOKEN repository secret for an account with accepted model conditions.'
            exit 1
          fi
          curl -fL --retry 3 -H "Authorization: Bearer $HF_TOKEN" \
            -o "$RUNNER_TEMP/mtab-small.safetensors" \
            'https://huggingface.co/MuScriptor/muscriptor-small/resolve/main/model.safetensors'
          echo "bbd482c786b895cf7d8f44185073d951adae2ebb8a66f82ca84cd1f84569549c  $RUNNER_TEMP/mtab-small.safetensors" | sha256sum -c -
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyGuitarPro==0.10.1
      - name: Validate real-model GP5 against IR
        env:
          MTAB_SMALL_WEIGHTS: ${{ runner.temp }}/mtab-small.safetensors
          MTAB_PYGUITARPRO_PYTHON: python
          MATMUL_NUM_THREADS: '2'
        run: |
          cargo test --locked --release -p mtab-cli --test small_checkpoint_smoke \
            real_small_gp5_ir_independent_roundtrip -- --ignored --nocapture
      - name: Transcribe and score real GuitarSet excerpt
        env:
          MTAB_SMALL_WEIGHTS: ${{ runner.temp }}/mtab-small.safetensors
          MATMUL_NUM_THREADS: '2'
        run: |
          cargo test --locked --release -p mtab-cli --test small_checkpoint_smoke \
            real_small_guitarset_excerpt_note_evaluation -- --ignored --nocapture 2>&1 | tee real-small-test.log
      - name: Upload test log (no model weights)
        uses: actions/upload-artifact@v4
        with:
          name: real-small-guitar-test
          path: real-small-test.log
          if-no-files-found: error
